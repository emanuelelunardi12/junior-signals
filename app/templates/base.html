<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Junior Signals{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..750&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Junior Signals</a>
    {% if user %}
    <nav>
      <a href="/dashboard">Signals</a>
      {% if admin or request.url.path.startswith('/admin') %}<a href="/admin">Review</a>{% endif %}
      <a href="/logout">Log out</a>
    </nav>
    {% endif %}
  </header>
  <main>{% block main %}{% endblock %}</main>
</body>
</html>
